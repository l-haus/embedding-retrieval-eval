[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-retrieval-eval"
version = "0.1.0"
description = "A small, reproducible harness for evaluating embedding-based retrieval systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "sentence-transformers>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
retrieval-eval = "retrieval_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Lets `pytest` import the package from src/ without installing first.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear,
# SIM simplify, RUF ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use assert-heavy style freely.
"tests/*" = ["S101"]
